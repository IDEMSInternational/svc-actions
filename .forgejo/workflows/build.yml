# Builds a book's site, packages it, keeps the archive, and publishes it from
# main. Every book on git.idems.international calls this from its own
# .forgejo/workflows/site-archive.yml:
#
#   jobs:
#     site:
#       uses: IDEMSInternational/svc-actions/.forgejo/workflows/build.yml@main
#       secrets: inherit
#       with:
#         feedback: false
#
# The book says nothing else. Whether it is a base or a variant is read from
# its .svc/config.json:
#
#   base     built as it is;
#   variant  resolved against its pinned parent first, with svc's resolver.
#
# Either way the build files come from svc at build time, not from the book:
# the svc-id HTML layer (xsl/), its wrapper and the packager (tools/), and the
# feedback tool (feedback/), all under scripts/base/ in svc. A change to them is
# made once, in svc (IDEMSInternational/svc#355).
#
# This repository is public because Forgejo only lets a workflow call another
# repository's workflow when that repository is public. svc is private, so it
# is cloned with the caller's VARIANT_BUILD_READ_TOKEN, an organisation secret
# that reaches this workflow through `secrets: inherit`. The job's own token,
# github.repository and vars are the calling book's.
name: build

on:
  workflow_call:
    inputs:
      feedback:
        description: Add the comment and edit tool to the site (svc#317). Its issues go to the calling repository.
        type: boolean
        default: false
      max-ptx-errors:
        description: >-
          Tolerate a non-zero exit from pretext as long as it wrote the site and
          logged at most this many PTX:ERROR lines. Empty means any failure fails.
        type: string
        default: ""
      pdf:
        description: >-
          Also build the book's `print` target as a PDF and keep it as the
          artifact `book-pdf`. It runs after the site is published and can fail
          without failing the run. Skipped for a book with no `print` target.
        type: boolean
        default: true
      svc-ref:
        description: The branch, tag or commit of svc to build with.
        type: string
        default: main
      stack-bank:
        description: >-
          A repository in the IDEMSInternational organisation, cloned to
          assets/stack/<name> in the built tree. For a book whose STACK questions
          live in a submodule upstream, which a base made by svc does not carry.
          Empty means none.
        type: string
        default: ""

jobs:
  archive:
    # The runner declares exactly one label, ubuntu-latest. A runs-on that
    # matches no label is not rejected -- the job queues forever.
    #
    # No `container:` here. checkout and upload-artifact are JavaScript
    # actions, so whatever they run in must have node; the runner's own image
    # does, and a bare python image does not.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: book

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch svc
        env:
          VARIANT_BUILD_READ_TOKEN: ${{ secrets.VARIANT_BUILD_READ_TOKEN }}
          SVC_REF: ${{ inputs.svc-ref }}
        # The token is written to a file rather than into a remote URL, so it
        # cannot reach the job log through a command echo or a git error. It
        # stays for the rest of the job: a variant's resolver clones its parents.
        run: |
          umask 077
          if [ -z "$VARIANT_BUILD_READ_TOKEN" ]; then
            echo "Not configured: set the Actions secret VARIANT_BUILD_READ_TOKEN, on this"
            echo "repository or on the organisation, to a token that can read"
            echo "IDEMSInternational/svc and, for a variant, its parent book."
            exit 1
          fi
          printf 'https://x-access-token:%s@git.idems.international\n' "$VARIANT_BUILD_READ_TOKEN" >"$HOME/.git-credentials"
          git config --global credential.helper store
          git config --global --add safe.directory '*'
          # svc's Forgejo mirror tracks GitHub every 10 minutes. Fetching by ref
          # rather than cloning a branch also takes a tag or a commit.
          git init -q svc
          git -C svc fetch -q --depth 1 https://git.idems.international/IDEMSInternational/svc.git "$SVC_REF"
          git -C svc checkout -q FETCH_HEAD
          echo "svc at $(git -C svc rev-parse --short HEAD) ($SVC_REF)"

      - name: Install
        run: |
          role=$(python -c 'import json; print(json.load(open("book/.svc/config.json"))["role"])')
          echo "This book is a $role."
          echo "ROLE=$role" >>"$GITHUB_ENV"
          pip install --no-cache-dir "pretext==2.52.3"
          # A base without the feedback tool needs only PreTeXt; the resolver
          # and site_feedback.py need the svc library.
          if [ "$role" = variant ] || [ "${{ inputs.feedback }}" = true ]; then
            pip install --no-cache-dir ./svc
          fi

      - name: Resolve a variant against its parent
        if: env.ROLE == 'variant'
        run: python svc/scripts/resolve_variant.py book resolved

      - name: Add svc's build files to the tree
        # The tree is the book itself for a base, and the resolved book for a
        # variant. Copies at the same paths the wrapper expects, beside
        # project.ptx; a file of the same name already in the tree is replaced.
        run: |
          if [ "$ROLE" = variant ]; then tree=resolved; else tree=book; fi
          echo "TREE=$tree" >>"$GITHUB_ENV"
          mkdir -p "$tree/xsl" "$tree/tools"
          cp svc/scripts/base/xsl/svc-id-attributes.xsl "$tree/xsl/"
          cp svc/scripts/base/tools/with_svc_layer.py svc/scripts/base/tools/package_site.py "$tree/tools/"
          rm -rf "$tree/feedback"
          cp -r svc/scripts/base/feedback "$tree/"

      - name: Add the STACK question bank
        if: inputs.stack-bank != ''
        env:
          STACK_BANK: ${{ inputs.stack-bank }}
        # The sources name the bank by path (stack/<name>/...), as the upstream
        # submodule does. Cloned with the credentials Fetch svc stored.
        run: |
          rm -rf "$TREE/assets/stack/$STACK_BANK"
          mkdir -p "$TREE/assets/stack"
          git clone -q --depth 1 "https://git.idems.international/IDEMSInternational/$STACK_BANK.git" "$TREE/assets/stack/$STACK_BANK"
          echo "$STACK_BANK at $(git -C "$TREE/assets/stack/$STACK_BANK" rev-parse --short HEAD)"
          rm -rf "$TREE/assets/stack/$STACK_BANK/.git"

      - name: Build the site
        shell: bash
        env:
          # Read by tools/with_svc_layer.py. Without a repository the site has
          # no feedback tool. Readers without an account comment through the
          # relay, which posts as idems-feedback-bot. Editing follows the
          # repository's visibility (svc#331). See docs/site-feedback.md in svc.
          SVC_FEEDBACK_REPO: ${{ inputs.feedback && github.repository || '' }}
          SVC_FEEDBACK_RELAY: ${{ inputs.feedback && 'https://script.google.com/macros/s/AKfycbxvsnpfkSkJBGklgPhPQa-zpuYFGTqDSdzHyVlMQDhnCFJ1ElTrBvMTP27AopFxCQiSOA/exec' || '' }}
          SVC_FEEDBACK_VISIBILITY: ${{ inputs.feedback && (github.event.repository.private && 'private' || 'public') || '' }}
          MAX_PTX_ERRORS: ${{ inputs.max-ptx-errors }}
        run: |
          cd "$TREE"
          if [ -z "$MAX_PTX_ERRORS" ]; then
            exec python tools/with_svc_layer.py pretext build web
          fi
          # Some books trip a PreTeXt bug that makes pretext exit non-zero while
          # still writing the site. Fail only if no site is written or if the
          # error count rises above the ceiling the book declares.
          set +e
          python tools/with_svc_layer.py pretext build web 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          errors=$(grep -c 'PTX:ERROR' build.log || true)
          echo "pretext exited with status $status and logged $errors PTX:ERROR lines (ceiling $MAX_PTX_ERRORS)."
          if [ ! -f output/web/index.html ]; then
            echo "No site was written."
            exit 1
          fi
          if [ "$errors" -gt "$MAX_PTX_ERRORS" ]; then
            echo "More PreTeXt errors than the known ones: something new needs fixing."
            exit 1
          fi

      - name: Publish open feedback and the book's categories with the site
        # git.idems.international sends no CORS headers, so the page can't ask
        # Forgejo what is open. This writes open.json, editors.json and
        # categories.json into the site instead (docs/site-feedback.md in svc).
        if: inputs.feedback
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEEDBACK_EDITORS: ${{ vars.FEEDBACK_EDITORS }}
        run: python svc/scripts/site_feedback.py site-json --out "$TREE/output/web/_svc-feedback" --book book --resolved "$TREE"

      - name: Package the built site
        # The repository may be private and a published site is not, so the
        # archive is assembled from the build output alone, against an
        # allowlist. Read its report here before trusting an archive.
        run: python "$TREE/tools/package_site.py" "$TREE/output/web" dist/site.tar.gz

      - name: Keep the archive for review
        # v3, deliberately: v4 talks to GitHub's newer artifact API, which
        # Forgejo's artifact backend does not implement. Do not "upgrade".
        uses: actions/upload-artifact@v3
        with:
          name: site-archive
          path: dist/site.tar.gz
          retention-days: 14

      - name: Publish the site
        # Only main is published; other branches are reviewed from the archive.
        # What goes up is the allowlisted archive above, never the raw build
        # output. git-pages authorizes the upload by asking the forge whether
        # this token can push to the repository the site URL names
        # (IDEMSInternational/svc#334).
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          FORGE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          site="https://idemsinternational.pages.idems.international/${GITHUB_REPOSITORY#*/}/"
          curl --fail-with-body -sS -X PUT \
            -H "Content-Type: application/x-tar+gzip" \
            -H "Forge-Authorization: token $FORGE_TOKEN" \
            --data-binary @dist/site.tar.gz "$site"
          echo "Published $site"

      - name: Install LaTeX for the PDF
        # After the publish step, so nothing here can hold up the site. The
        # tree still holds the web build's generated assets (the STACK .ptx
        # the print build reads), which is why the PDF is built here and not
        # in a job of its own.
        if: inputs.pdf
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends             texlive-xetex texlive-latex-extra texlive-fonts-recommended             texlive-fonts-extra texlive-science fonts-dejavu fonts-noto-core             latexmk fontconfig
          # The print build screenshots interactive figures with Chromium, which
          # pretext has already downloaded; the runner lacks its system libraries.
          python -m playwright install-deps chromium

      - name: Build the PDF
        if: inputs.pdf
        id: pdf
        continue-on-error: true
        shell: bash
        run: |
          cd "$TREE"
          if ! grep -q 'name="print"' project.ptx; then
            echo "This book has no print target, so no PDF."
            exit 0
          fi
          # `pretext build` never makes the STACK .ptx files, only an explicit
          # `generate stack` does. The web build doesn't need them (it uses the
          # live STACK server); the print build reads them.
          if [ -d assets/stack ]; then pretext generate stack; fi
          # LaTeX cannot include a GIF. Replace each one, in this throwaway tree
          # only, by a PNG of its first frame and point the sources at it. The
          # web site, already published, keeps the animation.
          pip install --no-cache-dir -q pillow
          python - <<'PY'
          import pathlib, re
          from PIL import Image
          skip = {"output", ".git", "interactive"}
          files = [p for p in pathlib.Path(".").rglob("*") if p.is_file() and not skip & set(p.parts)]
          # LaTeX reads PNG, JPEG and PDF only. An animated GIF or a WebP file becomes a
          # PNG of its first frame, and the sources are pointed at it.
          others = [p for p in files if p.suffix.lower() in (".gif", ".webp")]
          for g in others:
              with Image.open(g) as im:
                  im.seek(0)
                  im.convert("RGBA").save(g.with_suffix(".png"))
          print(f"Replaced {len(others)} GIF/WebP file(s) by a still PNG")
          # A file named .png or .jpg can hold another format (a WebP renamed .png turns
          # up): browsers cope, LaTeX does not. Rewrite it in the format its name says.
          fixed = 0
          for p in files:
              ext = p.suffix.lower()
              if ext not in (".png", ".jpg", ".jpeg"):
                  continue
              try:
                  with Image.open(p) as im:
                      if im.format in ("PNG", "JPEG"):
                          continue
                      im.seek(0)
                      want = "PNG" if ext == ".png" else "JPEG"
                      out = im.convert("RGBA" if want == "PNG" else "RGB")
              except Exception:
                  continue
              out.save(p, want)
              fixed += 1
          print(f"Rewrote {fixed} image(s) whose content did not match their name")
          # An <image> whose file is not in the tree (a book that does not carry its
          # generated figures) is a fatal LaTeX error ("Unable to load picture"), where
          # the web build only shows a broken image. In this throwaway tree, put a grey
          # placeholder naming the file where it should be, so the PDF still builds.
          from PIL import ImageDraw
          imgsrc = re.compile(r"""<image\b[^>]*?\bsource=["']([^"']+)["']""", re.S)
          wanted = set()
          for root in ("source", "generated-assets"):
              for f in pathlib.Path(root).rglob("*.ptx"):
                  wanted.update(imgsrc.findall(f.read_text(encoding="utf-8")))
          made = 0
          for rel in sorted(wanted):
              ext = pathlib.Path(rel).suffix.lower()
              if ext not in (".png", ".jpg", ".jpeg") or rel.startswith(("http:", "https:")):
                  continue
              target = pathlib.Path("assets") / rel
              if target.is_file() and target.stat().st_size > 0:
                  continue
              target.parent.mkdir(parents=True, exist_ok=True)
              im = Image.new("RGB", (800, 450), (225, 225, 225))
              ImageDraw.Draw(im).text((20, 20), "Figure not available: " + rel, fill=(80, 80, 80))
              im.save(target, "PNG" if ext == ".png" else "JPEG")
              made += 1
          print(f"Added a placeholder for {made} image(s) missing from the tree")
          pat = re.compile(r"""(source=["'][^"']*)\.(?:gif|webp)(["'])""", re.I)
          n = 0
          for root in ("source", "generated-assets"):
              for f in pathlib.Path(root).rglob("*.ptx"):
                  t = f.read_text(encoding="utf-8")
                  u = pat.sub(r"\1.png\2", t)
                  if u != t:
                      f.write_text(u, encoding="utf-8", newline="")
                      n += 1
          print(f"Pointed {n} file(s) at the PNGs")
          # A STACK question gives an image's width in pixels; pretext turns it
          # into a percentage of a fixed page width, so anything wider than
          # about 480 px comes out above 100% and is a PTX:ERROR. Cap it.
          wide = re.compile(r'(<image\b[^>]*?\bwidth=")(\d+(?:\.\d+)?)%"')
          def cap(m):
              return m.group(0) if float(m.group(2)) <= 100 else m.group(1) + '100%"'
          n = 0
          for f in pathlib.Path("generated-assets").rglob("*.ptx"):
              t = f.read_text(encoding="utf-8")
              u = wide.sub(cap, t)
              if u != t:
                  f.write_text(u, encoding="utf-8", newline="")
                  n += 1
          print(f"Capped over-wide images in {n} STACK file(s)")
          # A table whose rows have more cells than it declares columns stops LaTeX
          # ("Extra alignment tab"); a browser does not mind. Declare the missing columns.
          tab = re.compile(r"<tabular\b[^>]*>.*?</tabular>", re.S)
          colre = re.compile(r"<col\b[^>]*?/>")
          rowre = re.compile(r"<row\b[^>]*>(.*?)</row>", re.S)
          cellre = re.compile(r"<cell\b([^>]*?)/?>")
          spanre = re.compile(r'colspan="(\d+)"')
          def widen(m):
              body = m.group(0)
              cols = list(colre.finditer(body))
              if not cols:
                  return body
              widest = 0
              for r in rowre.finditer(body):
                  k = 0
                  for c in cellre.finditer(r.group(1)):
                      s = spanre.search(c.group(1))
                      k += int(s.group(1)) if s else 1
                  widest = max(widest, k)
              if widest <= len(cols):
                  return body
              end = cols[-1].end()
              return body[:end] + '<col halign="left"/>' * (widest - len(cols)) + body[end:]
          n = 0
          for root in ("source", "generated-assets"):
              for f in pathlib.Path(root).rglob("*.ptx"):
                  t = f.read_text(encoding="utf-8")
                  u = tab.sub(widen, t)
                  if u != t:
                      f.write_text(u, encoding="utf-8", newline="")
                      n += 1
          print(f"Added missing columns to tables in {n} file(s)")
          # A STACK question can carry browser-only elements: a <script> that builds a
          # "download the data" file, the <button> that calls it, a <style>. In print the
          # script comes out as pages of code listing, and one very long line in it stopped
          # LaTeX ("This can't happen (vlistout)"). None of them mean anything on paper.
          webonly = re.compile(
              r"<script\b.*?</script>|<style\b.*?</style>|<button\b.*?</button>", re.S | re.I
          )
          n = 0
          for f in pathlib.Path("generated-assets").rglob("*.ptx"):
              t = f.read_text(encoding="utf-8")
              u = webonly.sub("", t)
              if u != t:
                  f.write_text(u, encoding="utf-8", newline="")
                  n += 1
          print(f"Removed browser-only script, style and button elements from {n} STACK file(s)")
          PY
          mkdir -p "$GITHUB_WORKSPACE/dist"
          set +e
          pretext build print
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            # When LaTeX fails pretext deletes its scratch folder, log included, and says
            # only that the compilation failed. So build the book's LaTeX target instead
            # and run LaTeX in its output folder: the log then survives, is shown here,
            # and is kept as an artifact with the .tex.
            mkdir -p "$GITHUB_WORKSPACE/dist/pdf-logs"
            if grep -q 'name="print-latex"' project.ptx; then
              # Its exit status is not what matters (a preview screenshot can time out
              # and still leave main.tex); whether main.tex was written is.
              pretext build print-latex >latex-build.log 2>&1 || true
              lx=$(python -c 'import sys, xml.etree.ElementTree as ET
          for t in ET.parse("project.ptx").getroot().iter("target"):
              if t.get("name") == sys.argv[1]:
                  o = t.find("output-dir")
                  print((o.text if o is not None and o.text else "output/" + sys.argv[1]).strip())
                  break' print-latex)
              if [ -f "$lx/main.tex" ]; then
                (cd "$lx" && xelatex -interaction=nonstopmode -halt-on-error main.tex >xelatex.out 2>&1) || true
                echo "=== LaTeX errors from $lx/main.log ==="
                grep -n -A6 '^!' "$lx/main.log" | head -150 || true
                echo "=== end of the LaTeX run ==="
                tail -25 "$lx/xelatex.out" || true
                cp "$lx/main.tex" "$lx/main.log" "$lx/xelatex.out" "$GITHUB_WORKSPACE/dist/pdf-logs/" 2>/dev/null || true
              else
                echo "The print-latex target wrote no main.tex, so no LaTeX log to keep."
                tail -15 latex-build.log || true
              fi
            else
              echo "No print-latex target to rerun LaTeX with, so no LaTeX log to keep."
            fi
            exit "$status"
          fi
          pdf=$(ls output/print/*.pdf | head -1)
          cp "$pdf" "$GITHUB_WORKSPACE/dist/book.pdf"
          echo "PDF $(du -h "$GITHUB_WORKSPACE/dist/book.pdf" | cut -f1) from $pdf"

      - name: Keep the LaTeX log if the PDF failed
        if: always() && inputs.pdf
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: book-pdf-logs
          path: dist/pdf-logs
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the PDF
        if: inputs.pdf
        continue-on-error: true
        # v3, as above.
        uses: actions/upload-artifact@v3
        with:
          name: book-pdf
          path: dist/book.pdf
          if-no-files-found: ignore
          retention-days: 14
